# Book settings
# Learn more at https://jupyterbook.org/en/stable/customize/config.html

title: "sarathmenon"
copyright: "2026"

execute:
  execute_notebooks: "off"

only_build_toc_files: true
exclude_patterns: [".github/*", "_build", "README.md"]

# Information about where the book exists on the web
repository:
  url: https://github.com/srmnitc/srmnitc.github.io
  path_to_book: "."
  branch: main

parse:
  myst_enable_extensions:
    # don't forget to list any other extensions you want enabled,
    # including those that are enabled by default!
    - html_image
    - amsmath
    - dollarmath
    - linkify
    - substitution
    - colon_fence

sphinx:
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_theme: furo
    html_static_path: ["docs/_static"]
    # Replaces the book-theme options Jupyter Book injects, which furo does not support
    html_theme_options:
      light_logo: logo_light.png
      dark_logo: logo_dark.png
      sidebar_hide_name: true

  extra_extensions:
  - 'sphinx_design'
